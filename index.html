<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Test Engine — Fantasy RPG Prototype</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#151c25;--line:#344152;--gold:#d7b36a;--text:#edf2f7;--muted:#9ba8b7;--red:#c95454;--green:#5fb477}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080b10;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}#game{position:relative;width:100vw;height:100vh;min-height:520px;background:#111}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;z-index:3;left:14px;top:14px;width:min(300px,calc(100vw - 28px));background:linear-gradient(180deg,rgba(13,17,23,.94),rgba(13,17,23,.78));border:1px solid #3a4655;border-radius:10px;padding:10px;box-shadow:0 8px 30px #0008;backdrop-filter:blur(5px)}
.name{font-weight:800;font-size:16px}.level{float:right;color:var(--gold)}
.bar{height:9px;background:#252d37;border-radius:6px;overflow:hidden;margin-top:7px;border:1px solid #10151b}.fill{height:100%;transition:width .12s linear}.hp{background:linear-gradient(90deg,#8e2f39,#d45d62)}.xp{background:linear-gradient(90deg,#8b6b27,#d9b85e)}
.stats{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:4px}
.help{position:absolute;z-index:3;right:14px;top:14px;background:#0d1117d9;border:1px solid #3a4655;border-radius:8px;padding:8px 10px;color:#b8c2ce;font-size:12px}
.log{position:absolute;z-index:3;left:14px;bottom:14px;width:min(390px,calc(100vw - 28px));min-height:52px;background:#0d1117db;border:1px solid #3a4655;border-radius:9px;padding:8px 10px;color:#cbd3dc;font-size:12px;line-height:1.45}
.controls{position:absolute;z-index:4;right:18px;bottom:18px;display:flex;gap:12px;align-items:end;pointer-events:none}
.joy{width:116px;height:116px;border-radius:50%;border:1px solid #8290a055;background:#0d1117aa;position:relative;pointer-events:auto;touch-action:none}
.knob{position:absolute;width:48px;height:48px;left:34px;top:34px;border-radius:50%;background:#c4ccd588;border:1px solid #fff5;box-shadow:0 3px 12px #0008}
.attack{width:74px;height:74px;border-radius:50%;border:1px solid #fff4;background:radial-gradient(circle at 35% 30%,#df7b67,#7c2930);color:white;font-weight:800;box-shadow:0 5px 18px #0009;pointer-events:auto;touch-action:manipulation}
@media(max-width:650px){.help{display:none}.hud{font-size:12px}.log{bottom:144px;min-height:42px;width:calc(100vw - 28px)}}
</style>
</head>
<body>
<div id="game">
<canvas id="world" aria-label="Fantasy-Spielwelt"></canvas>
<div class="hud">
  <span class="name">Held</span><span class="level">Stufe <b id="level">1</b></span>
  <div class="bar"><div id="hp" class="fill hp" style="width:100%"></div></div>
  <div class="stats"><span>LP <b id="hpText">100 / 100</b></span><span>Gold <b id="gold">25</b></span></div>
  <div class="bar"><div id="xp" class="fill xp" style="width:0%"></div></div>
  <div class="stats"><span>Erfahrung</span><span id="xpText">0 / 100</span></div>
</div>
<div class="help">WASD / Pfeile · Gegner anklicken oder <b>Angriff</b></div>
<div id="log" class="log">Erkunde die Karte. Ein Gegner wartet in der Nähe.</div>
<div class="controls">
  <div id="joy" class="joy" aria-label="Bewegungsjoystick"><div id="knob" class="knob"></div></div>
  <button id="attack" class="attack" type="button" aria-label="Angreifen">⚔</button>
</div>
</div>
<script>
(() => {
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');
const hpEl=document.getElementById('hp'),hpText=document.getElementById('hpText'),xpEl=document.getElementById('xp'),xpText=document.getElementById('xpText'),levelEl=document.getElementById('level'),goldEl=document.getElementById('gold'),logEl=document.getElementById('log');
let W=0,H=0,dpr=1,last=performance.now(),keys=new Set(),attackPressed=false;
const map={w:3600,h:2400};
const player={x:1800,y:1300,r:18,hp:100,maxHp:100,xp:0,next:100,level:1,gold:25,angle:0,attack:0,hit:0};
const enemy={x:2200,y:1250,r:25,hp:80,maxHp:80,alive:true,respawn:0,hit:0,attack:0};
const trees=[],rocks=[],grass=[],flowers=[];
function rand(seed){let x=Math.sin(seed*999.13)*43758.5453;return x-Math.floor(x)}
for(let i=0;i<260;i++){let x=120+rand(i)*3360,y=120+rand(i*3.7)*2160; if(Math.hypot(x-player.x,y-player.y)>280) trees.push({x,y,s:0.75+rand(i+8)*.65});}
for(let i=0;i<150;i++){let x=rand(i+300)*map.w,y=rand(i+500)*map.h;rocks.push({x,y,s:.5+rand(i+90)*.7});}
for(let i=0;i<650;i++)grass.push({x:rand(i+800)*map.w,y:rand(i+900)*map.h,a:rand(i+1000)*Math.PI});
for(let i=0;i<180;i++)flowers.push({x:rand(i+1100)*map.w,y:rand(i+1200)*map.h,c:i%3});
const cam={x:player.x,y:player.y};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function say(t){logEl.textContent=t}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function sx(x){return x-cam.x+W/2} function sy(y){return y-cam.y+H/2}
function drawGround(){
 ctx.fillStyle='#31472f';ctx.fillRect(0,0,W,H);
 const left=cam.x-W/2,top=cam.y-H/2;
 // subtle terrain tiles
 for(let y=Math.floor(top/80)*80;y<top+H+80;y+=80)for(let x=Math.floor(left/80)*80;x<left+W+80;x+=80){
   const n=(Math.sin(x*.013)+Math.cos(y*.017))*0.5;
   ctx.fillStyle=n>0?'#385235':'#344d32';ctx.fillRect(sx(x),sy(y),81,81);
 }
 // paths
 ctx.strokeStyle='#806f52';ctx.lineWidth=80;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sx(200),sy(1700));ctx.bezierCurveTo(sx(900),sy(1550),sx(1250),sy(1100),sx(1850),sy(1300));ctx.bezierCurveTo(sx(2450),sy(1500),sx(2900),sy(900),sx(3450),sy(700));ctx.stroke();
 ctx.strokeStyle='#a28a61';ctx.lineWidth=62;ctx.beginPath();ctx.moveTo(sx(200),sy(1700));ctx.bezierCurveTo(sx(900),sy(1550),sx(1250),sy(1100),sx(1850),sy(1300));ctx.bezierCurveTo(sx(2450),sy(1500),sx(2900),sy(900),sx(3450),sy(700));ctx.stroke();
 // water
 ctx.fillStyle='#254e63';ctx.beginPath();ctx.ellipse(sx(520),sy(520),380,230,-.25,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#4d8092';ctx.lineWidth=3;for(let i=0;i<7;i++){ctx.beginPath();ctx.moveTo(sx(270),sy(390+i*48));ctx.quadraticCurveTo(sx(500),sy(370+i*48),sx(730),sy(410+i*48));ctx.stroke()}
}
function drawNature(){
 for(const g of grass){let x=sx(g.x),y=sy(g.y);if(x<-10||x>W+10||y<-10||y>H+10)continue;ctx.strokeStyle='#59754b';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y+4);ctx.lineTo(x-3,y-3);ctx.moveTo(x,y+4);ctx.lineTo(x+3,y-4);ctx.stroke()}
 for(const f of flowers){let x=sx(f.x),y=sy(f.y);if(x<-8||x>W+8||y<-8||y>H+8)continue;ctx.fillStyle=['#e5b7bd','#e7cf82','#aebbdc'][f.c];ctx.beginPath();ctx.arc(x,y,2.4,0,Math.PI*2);ctx.fill()}
 for(const r of rocks){let x=sx(r.x),y=sy(r.y),s=r.s;if(x<-50||x>W+50||y<-50||y>H+50)continue;ctx.fillStyle='#59615c';ctx.beginPath();ctx.ellipse(x,y,18*s,11*s,-.2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#707973';ctx.stroke()}
 for(const t of trees){let x=sx(t.x),y=sy(t.y),s=t.s;if(x<-70||x>W+70||y<-100||y>H+100)continue;
   ctx.fillStyle='#1f2a1f';ctx.beginPath();ctx.ellipse(x,y+28*s,28*s,10*s,0,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#63472f';ctx.fillRect(x-7*s,y+2*s,14*s,42*s);
   ctx.fillStyle='#203d25';ctx.beginPath();ctx.arc(x,y-12*s,31*s,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#2e5931';ctx.beginPath();ctx.arc(x-18*s,y+2*s,24*s,0,Math.PI*2);ctx.arc(x+19*s,y+1*s,23*s,0,Math.PI*2);ctx.arc(x,y-29*s,26*s,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#3d6a38';ctx.beginPath();ctx.arc(x-9*s,y-35*s,13*s,0,Math.PI*2);ctx.arc(x+16*s,y-18*s,12*s,0,Math.PI*2);ctx.fill();
 }
}
function shadow(x,y,rx,ry){ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function drawCharacter(){
 const x=sx(player.x),y=sy(player.y);shadow(x,y+15,19,8);
 ctx.save();ctx.translate(x,y);ctx.rotate(player.angle);
 ctx.fillStyle='#344a6b';ctx.beginPath();ctx.moveTo(-13,17);ctx.lineTo(-11,-1);ctx.lineTo(0,-12);ctx.lineTo(11,-1);ctx.lineTo(13,17);ctx.closePath();ctx.fill();
 ctx.fillStyle='#b8835d';ctx.beginPath();ctx.arc(0,-10,9,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#2b1d18';ctx.beginPath();ctx.arc(0,-14,9,Math.PI,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#d5c08a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(10,3);ctx.lineTo(23,-11);ctx.stroke();
 if(player.attack>0){ctx.strokeStyle='#ead9a2';ctx.lineWidth=3;ctx.globalAlpha=Math.min(1,player.attack*5);ctx.beginPath();ctx.arc(0,0,42,-.9,.6);ctx.stroke()}
 ctx.restore();
}
function drawEnemy(){
 if(!enemy.alive)return;const x=sx(enemy.x),y=sy(enemy.y);shadow(x,y+20,25,9);
 ctx.fillStyle='#502a2d';ctx.beginPath();ctx.arc(x,y,25,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#7b3d40';ctx.beginPath();ctx.arc(x,y-5,20,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#c7a26a';ctx.beginPath();ctx.moveTo(x-15,y-20);ctx.lineTo(x-8,y-34);ctx.lineTo(x-1,y-21);ctx.moveTo(x+15,y-20);ctx.lineTo(x+8,y-34);ctx.lineTo(x+1,y-21);ctx.fill();
 ctx.fillStyle='#efc8c8';ctx.beginPath();ctx.arc(x-8,y-5,3,0,Math.PI*2);ctx.arc(x+8,y-5,3,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#181b1e';ctx.fillRect(x-25,y-43,50,6);ctx.fillStyle='#c95454';ctx.fillRect(x-24,y-42,48*(enemy.hp/enemy.maxHp),4);
}
function updateUI(){hpEl.style.width=(player.hp/player.maxHp*100)+'%';hpText.textContent=Math.ceil(player.hp)+' / '+player.maxHp;xpEl.style.width=(player.xp/player.next*100)+'%';xpText.textContent=player.xp+' / '+player.next;levelEl.textContent=player.level;goldEl.textContent=player.gold}
function attack(){
 if(player.attack>0||!enemy.alive)return;
 const d=Math.hypot(enemy.x-player.x,enemy.y-player.y);
 if(d>105){say('Der Gegner ist zu weit entfernt.');return}
 player.attack=.28;enemy.hit=.18;enemy.hp-=34;
 if(enemy.hp<=0){enemy.alive=false;enemy.respawn=4;player.xp+=50;player.gold+=8;say('Gegner besiegt! +50 EP · +8 Gold');if(player.xp>=player.next){player.xp-=player.next;player.level++;player.maxHp+=15;player.hp=player.maxHp;player.next=Math.round(player.next*1.25);say('Stufenaufstieg! Du bist jetzt Stufe '+player.level+'.')}}
 else {say('Treffer! Der Gegner hat noch '+enemy.hp+' LP.')}
 updateUI()
}
document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();attack()});
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){const x=e.clientX-W/2+cam.x,y=e.clientY-H/2+cam.y;if(Math.hypot(x-enemy.x,y-enemy.y)<70){player.angle=Math.atan2(y-player.y,x-player.x);attack()}}});
addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','BUTTON'].includes(e.target.tagName))return;keys.add(e.key.toLowerCase());if(e.key===' '){e.preventDefault();attack()}});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
const joy=document.getElementById('joy'),knob=document.getElementById('knob');let joyId=null,jx=0,jy=0;
function joyMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy),m=34;if(l>m){dx=dx/l*m;dy=dy/l*m}jx=dx/m;jy=dy/m;knob.style.transform='translate('+dx+'px,'+dy+'px)'}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(joyId);joyMove(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});
joy.addEventListener('pointerup',e=>{if(e.pointerId===joyId){joyId=null;jx=jy=0;knob.style.transform='translate(0,0)'}});
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;
 let dx=0,dy=0;if(keys.has('w')||keys.has('arrowup'))dy-=1;if(keys.has('s')||keys.has('arrowdown'))dy+=1;if(keys.has('a')||keys.has('arrowleft'))dx-=1;if(keys.has('d')||keys.has('arrowright'))dx+=1;dx+=jx;dy+=jy;
 const l=Math.hypot(dx,dy);if(l>0.05){dx/=l;dy/=l;player.angle=Math.atan2(dy,dx);const speed=190;player.x=clamp(player.x+dx*speed*dt,40,map.w-40);player.y=clamp(player.y+dy*speed*dt,40,map.h-40)}
 player.attack=Math.max(0,player.attack-dt);enemy.hit=Math.max(0,enemy.hit-dt);enemy.attack=Math.max(0,enemy.attack-dt);
 if(enemy.alive){const d=Math.hypot(player.x-enemy.x,player.y-enemy.y);if(d<360){const a=Math.atan2(player.y-enemy.y,player.x-enemy.x);enemy.x+=Math.cos(a)*30*dt;enemy.y+=Math.sin(a)*30*dt;if(d<62&&enemy.attack<=0){enemy.attack=.9;player.hp=Math.max(0,player.hp-8);say('Der Gegner trifft dich.');updateUI();if(player.hp<=0){player.hp=player.maxHp;player.x=1800;player.y=1300;say('Du wurdest besiegt und kehrst zum Ausgangspunkt zurück.');updateUI()}}}}
 else {enemy.respawn-=dt;if(enemy.respawn<=0){enemy.alive=true;enemy.hp=enemy.maxHp;enemy.x=2200;enemy.y=1250;say('Ein neuer Gegner erscheint.')}}
 cam.x+=(player.x-cam.x)*Math.min(1,dt*7);cam.y+=(player.y-cam.y)*Math.min(1,dt*7);
 ctx.clearRect(0,0,W,H);drawGround();drawNature();drawEnemy();drawCharacter();requestAnimationFrame(loop)}
updateUI();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
